name = "chinarose-schedule-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "SCHEDULES"
# Fill in the real namespace id before any wrangler deploy. Deploying with a
# placeholder or a fresh namespace makes every station look empty (rev 0) even
# though the real data is untouched. GitHub Pages deploys never touch KV.
id = "REPLACE_WITH_YOUR_NAMESPACE_ID"

# Password that unlocks crew editing on schedule-only stations (`/api/staff`).
# It grants no other write — publishing still needs SCHEDULE_WRITE_TOKEN.
# Hardcoded for now to the demo value "test" in worker/src/index.ts; override it
# with a Worker secret (wrangler secret put STAFF_EDIT_PASSWORD) for anything
# beyond the demo.
