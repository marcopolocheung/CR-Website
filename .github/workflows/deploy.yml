name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # sitemap lastmod is derived from each route's own commit history, so
          # the shallow default clone would date every page to the last deploy.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run build
        env:
          # Empty for a custom domain (chinarosesa.com). Only a project-pages
          # deploy needs a basePath, and setting one wrongly rewrites every
          # asset URL and canonical on the site.
          NEXT_PUBLIC_BASE_PATH: ''
          # GA4 measurement ID. Set as a repository *variable* (not a secret) —
          # it is served in the page source, so it is public by design, and a
          # variable can be read and changed without re-entering it. Unset, the
          # build simply ships no analytics rather than failing.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      # The SEO guarantees — canonicals, JSON-LD, headings, robots, sitemap,
      # noindex on staff routes — are only guarantees if a broken one fails the
      # deploy instead of shipping.
      - run: npm run seo:check

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
